                </div>
            </section>

            <!-- 중단: 트레이딩뷰 실시간 라이브 차트 -->
            <section class="flex-1 bg-[#161a1e] relative min-h-[450px]">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container h-full w-full">

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                    <script type="text/javascript">
                    new TradingView.widget({

        <!-- 우측: Pionex 스타일 AI BOT 설정 패널 (25% 너비) -->

                    </div>
                </div>

                <hr class="border-gray-800">

</div>

                        <label class="text-gray-400 block mb-1.5 font-medium">Take Profit (KRW)</label>

                      <label class="text-gray-400 block mb-1.5 font-medium">봇 이름 (선택)</label>
                      <input id="bot_name" type="text" placeholder="My Grid Bot" class="w-full bg-[#0c0e12] border border-gray-800 rounded p-2 text-white font-mono text-sm">
                    </div>
                    <hr class="border-gray-800 mt-3">

                    <div id="bot_list_container" class="mt-3 text-xs text-gray-300">
                      <div class="font-medium mb-2">실행 중인 봇</div>
                      <div id="bot_list"></div>
                    </div>
                </div>
            </div>

                <div class="pt-6">
                <button id="create_btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-[#0c0e12] font-bold py-3 rounded text-sm transition shadow-lg shadow-emerald-500/10">
                    🚀 AI 트레이딩 봇 가동 시작
                </button>
            </div>
        </aside>

    </div>

<script>
(function(){
  const base = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') ? 'http://127.0.0.1:8000' : 'https://constraints-sunny-camp-antonio.trycloudflare.com';
  const metricsUrl = base + '/api/stream-data';
  const botCalcUrl = base + '/api/bot/calculator';
  const botCreateUrl = base + '/api/bot/create';

  // Bot builder UI helpers
  function $(sel, root=document){ return root.querySelector(sel); }
  const rightPane = document.querySelector('aside.w-1/4');
  const lowerInput = document.getElementById('lower_input');
  const upperInput = document.getElementById('upper_input');
  const gridRange = document.getElementById('grid_range');
  const investInput = document.getElementById('bot_invest');
  const buyFirstInput = document.getElementById('bot_buy_first');

  const takeProfitInput = document.getElementById('bot_take_profit');
  const botNameInput = document.getElementById('bot_name');
  const botList = document.getElementById('bot_list');
  const createBtn = document.getElementById('create_btn');
   createBtn.addEventListener('click', async function(ev){
     ev.preventDefault();
     createBtn.disabled = true; createBtn.innerText = '시작 중...';
     try{
-      const body = { lower_limit: Number(lowerInput.value), upper_limit: Number(upperInput.value), grid_qty: Number(gridRange.value), invest_amount: Number(investInput.value), mode: 'arithmetic' };
+      const body = { lower_limit: Number(lowerInput.value), upper_limit: Number(upperInput.value), grid_qty: Number(gridRange.value), invest_amount: Number(investInput.value), mode: 'arithmetic', buy_first: Boolean(buyFirstInput.checked), stop_loss: Number(stopLossInput.value)||null, take_profit: Number(takeProfitInput.value)||null, name: botNameInput.value||null };
       const res = await fetch(botCreateUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
       const j = await res.json();
       if(j.status === 'ok'){
         createBtn.innerText = '🚀 봇 가동 완료';
+        // refresh bot list
+        fetchBotList();
         setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1500);
       } else {
         createBtn.innerText = '실패'; setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1200);
       }
     }catch(e){ createBtn.innerText='오류'; setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1200); }
   });
+
+  async function fetchBotList(){

+      if(!res.ok) return;
+      const j = await res.json();
+      botList.innerHTML = '';
+      (j.bots||[]).forEach(b=>{
+        const d = document.createElement('div'); d.className='mb-2';
+        d.innerHTML = `<div class="flex justify-between"><div>${b.name||b.bot_id} <span class="text-gray-400 text-xs">(${b.lower}~${b.upper} / ${b.grid_qty})</span></div><div><button data-bid="${b.bot_id}" class="text-xs bg-rose-600 px-2 py-0.5 rounded text-white stop-bot">Stop</button></div></div>`;
+        botList.appendChild(d);
+      });
+      // attach stop handlers
+      botList.querySelectorAll('.stop-bot').forEach(btn=>btn.addEventListener('click', async function(){
+        const bid = this.dataset.bid;
+        await fetch(base + '/api/bot/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({bot_id: bid}) });
+        fetchBotList();
+      }));
+    }catch(e){/*ignore*/}
+  }
+
+  // initial list
+  fetchBotList();

    let node = document.getElementById('bot_calc_info');
    if(!node){ node = document.createElement('div'); node.id='bot_calc_info'; node.className='text-xs text-gray-300 mt-2'; investInput.parentNode.appendChild(node); }
    // summary header
    let html = `최소 필요: ₩${Number(calc.min_required_krw).toLocaleString()} · 그리드당 KRW: ₩${Number(calc.krw_per_grid).toLocaleString()} · 격자 간격: ₩${Number(calc.grid_spacing).toLocaleString()} (~${calc.percent_spacing}% ) · 예상 수익률(격자): ${calc.expected_profit_pct}% · 즉시 매수수량(추정): ${calc.initial_buy_qty}`;
    // grid points table if available
    if(Array.isArray(calc.grid_points)){
      let total_profit = 0;
      html += '<div class="mt-2 overflow-auto max-h-48">';
      html += '<table class="w-full text-xs"><thead><tr><th class="text-left">#</th><th class="text-left">Price</th><th class="text-left">KRW</th><th class="text-left">Qty</th><th class="text-left">Est Profit (KRW)</th></tr></thead><tbody>';
      // avoid rendering huge tables in the browser; decimate if too large
      const maxRows = Math.min(calc.grid_points.length, 300);
      if(calc.grid_points.length <= maxRows){
        calc.grid_points.forEach(g=>{
          total_profit += Number(g.expected_profit_krw||0);
          html += `<tr><td>${g.index}</td><td>₩${Number(g.price).toLocaleString()}</td><td>₩${Number(g.krw_alloc).toLocaleString()}</td><td>${g.qty}</td><td>₩${Number(g.expected_profit_krw).toLocaleString()}</td></tr>`;
        });
      } else {
        const step = Math.ceil(calc.grid_points.length / maxRows);
        for(let i=0;i<calc.grid_points.length;i+=step){
          const g = calc.grid_points[i];
          total_profit += Number(g.expected_profit_krw||0);
          html += `<tr><td>${g.index}</td><td>₩${Number(g.price).toLocaleString()}</td><td>₩${Number(g.krw_alloc).toLocaleString()}</td><td>${g.qty}</td><td>₩${Number(g.expected_profit_krw).toLocaleString()}</td></tr>`;
        }
        html += `<tr><td colspan='5' class='text-xs text-gray-400'>Showing decimated ${maxRows}/${calc.grid_points.length} rows for performance</td></tr>`;
      }
      html += `</tbody></table></div>`;
      html += `<div class="text-xs text-emerald-300 mt-1">예상 총 격자 이익(모든 격자 합산, 보수적 추정): ₩${Number(total_profit).toLocaleString()}</div>`;
      if(calc.current_price){ html += `<div class="text-xs text-gray-400 mt-1">현재가: ₩${Number(calc.current_price).toLocaleString()}</div>`; }
    }
    node.innerHTML = html;

    // render grid preview canvas
    (function renderGridPreview(){
      try{
        let canvas = document.getElementById('grid_preview');
        if(!canvas){
          canvas = document.createElement('canvas');
          canvas.id = 'grid_preview';
          canvas.width = 360;
          canvas.height = 120;
          canvas.style.width = '100%';
          canvas.style.height = '80px';
          canvas.className = 'mt-2 border border-gray-800';
          node.appendChild(canvas);
        }
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(!Array.isArray(calc.grid_points) || calc.grid_points.length===0) return;
        const gp = calc.grid_points;
        const prices = gp.map(x=>Number(x.price));
        const minP = Math.min(...prices);
        const maxP = Math.max(...prices);
        const range = Math.max(1, maxP - minP);
        // draw background
        ctx.fillStyle = '#0c0e12'; ctx.fillRect(0,0,canvas.width,canvas.height);
    // draw lines (limited for performance/readability)
    ctx.strokeStyle = '#2b3139'; ctx.lineWidth = 1;
    const maxLines = 200;
    const lineStep = Math.max(1, Math.ceil(gp.length / maxLines));
    const labelStep = Math.max(1, Math.ceil(gp.length / 10));
    for(let i=0;i<gp.length;i+=lineStep){
      const g = gp[i];
      const p = Number(g.price);
      const y = Math.round((1 - ((p - minP) / range)) * (canvas.height - 8) + 4);
      ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(canvas.width - 6, y); ctx.stroke();
      if(i % labelStep === 0){ ctx.fillStyle = '#9ca3af'; ctx.fillText(Number(p).toLocaleString(), 8, y-2); }
    }
        // price labels for min/max/current
        ctx.fillStyle = '#cbd5e1'; ctx.font = '12px monospace';
        ctx.fillText('High: ' + Number(maxP).toLocaleString(), 8, 14);
        ctx.fillText('Low: ' + Number(minP).toLocaleString(), 8, canvas.height - 6);
        if(calc.current_price){
          const cp = Number(calc.current_price);
          const y = Math.round((1 - ((cp - minP) / range)) * (canvas.height - 8) + 4);
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
          ctx.fillStyle = '#f59e0b'; ctx.fillText('Now: ' + Number(cp).toLocaleString(), canvas.width - 140, 14);
        }
      }catch(e){/*ignore*/}
    })();

    // disable create if insufficient funds
    if(!calc.can_run || Number(calc.available_krw) < Number(calc.min_required_krw)){
      createBtn.disabled = true; createBtn.classList.add('opacity-50');
      // show warning
      let w = document.getElementById('bot_calc_warn');
      if(!w){ w = document.createElement('div'); w.id='bot_calc_warn'; w.className='text-rose-400 text-xs mt-1'; investInput.parentNode.appendChild(w); }
      w.innerText = '잔액 부족 또는 설정값이 최소 요구사항을 만족하지 않습니다.';
    } else {
      createBtn.disabled = false; createBtn.classList.remove('opacity-50');
      const w = document.getElementById('bot_calc_warn'); if(w) w.remove();
    }
  }

  async function fetchCalc(){
    try{
      const body = { lower_limit: Number(lowerInput.value), upper_limit: Number(upperInput.value), grid_qty: Number(gridRange.value), invest_amount: Number(investInput.value) };
      const res = await fetch(botCalcUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if(!res.ok) return;
      const j = await res.json();
      renderCalc(j);
    }catch(e){/*ignore*/}
  }

  // Debounce helper
  let debounceId = null;
  function scheduleCalc(){ if(debounceId) clearTimeout(debounceId); debounceId = setTimeout(()=>{ fetchCalc(); debounceId=null; }, 150); }

  lowerInput.addEventListener('input', scheduleCalc);
  upperInput.addEventListener('input', scheduleCalc);
  gridRange.addEventListener('input', ()=>{ rightPane.querySelector('span.text-emerald-400').innerText = gridRange.value; scheduleCalc(); });
  investInput.addEventListener('input', scheduleCalc);

  // Create button - call backend to actually spawn bot
  createBtn.addEventListener('click', async function(ev){
    ev.preventDefault();
    createBtn.disabled = true; createBtn.innerText = '시작 중...';
    try{
      const body = { lower_limit: Number(lowerInput.value), upper_limit: Number(upperInput.value), grid_qty: Number(gridRange.value), invest_amount: Number(investInput.value), mode: 'arithmetic', buy_first: Boolean(buyFirstInput.checked), stop_loss: Number(stopLossInput.value)||null, take_profit: Number(takeProfitInput.value)||null, name: botNameInput.value||null };
      const res = await fetch(botCreateUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const j = await res.json();
      if(j.status === 'ok'){
        createBtn.innerText = '🚀 봇 가동 완료';
        // refresh bot list
        fetchBotList();
        setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1500);
      } else {
        createBtn.innerText = '실패'; setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1200);
      }
    }catch(e){ createBtn.innerText='오류'; setTimeout(()=>{ createBtn.innerText='🚀 AI 트레이딩 봇 가동 시작'; createBtn.disabled = false; }, 1200); }
  });

  // Polling loop - 1s interval
  async function pollStream(){
    try{
      const res = await fetch(metricsUrl,{cache:'no-cache'});
      if(!res.ok) return;
      const j = await res.json();

      // KPI: map total_assets + last prices for BTC/ETH
      if(j.metrics){
        // total assets
        const total = Number(j.metrics.total_assets || 0);
        document.getElementById('total_assets').innerText = '₩' + total.toLocaleString();
        // token cost (USD) - show two decimals
        const tc = Number(j.metrics.token_cost || 0);
        document.getElementById('token_cost').innerText = '$' + tc.toFixed(2) + ' (누적)';
        // daily goal percent
        const dg = Number(j.metrics.daily_goal || 0);
        document.getElementById('daily_goal').innerText = dg.toFixed(1) + '%';
        // active agents
        const aa = Number(j.metrics.active_agents || 0);
        document.getElementById('active_agents').innerText = aa + ' agents';
        // optional assets change badge
        try{
          const last = Number(j.metrics.last_price || 0);
          const prev = Number(document.getElementById('total_assets').dataset.prev || 0);
          const changeNode = document.getElementById('assets_change');
          if(prev && last){
            const pct = ((last - prev)/prev)*100;
            changeNode.innerText = (pct>=0?'+':'') + pct.toFixed(2) + '%';
            changeNode.style.color = pct>=0? 'var(--tw-text-emerald-500)' : 'var(--tw-text-rose-500)';
          }
          document.getElementById('total_assets').dataset.prev = last;
        }catch(e){}
      }

      // real-time trade prices
      try{
        const btcTrade = j.upbit && j.upbit['KRW-BTC'] && j.upbit['KRW-BTC'].trade && j.upbit['KRW-BTC'].trade.trade_price;
        const ethTrade = j.upbit && j.upbit['KRW-ETH'] && j.upbit['KRW-ETH'].trade && j.upbit['KRW-ETH'].trade.trade_price;
        if(btcTrade) document.getElementById('total_assets').dataset.btc = btcTrade; // keep as data attr
        if(ethTrade) document.getElementById('total_assets').dataset.eth = ethTrade;
        // display on KPI section by prepending small badges
        const kpiNode = document.getElementById('kpi_section');
        if(kpiNode){
          const ex = kpiNode.querySelector('#btc_price_badge') || (function(){const n=document.createElement('div');n.id='btc_price_badge';n.className='text-xs text-gray-300';kpiNode.children[0].appendChild(n);return n;})();
          const ey = kpiNode.querySelector('#eth_price_badge') || (function(){const n=document.createElement('div');n.id='eth_price_badge';n.className='text-xs text-gray-300';kpiNode.children[1].appendChild(n);return n;})();
          ex.innerText = btcTrade ? 'BTC: ₩' + Number(btcTrade).toLocaleString() : '';
          ey.innerText = ethTrade ? 'ETH: ₩' + Number(ethTrade).toLocaleString() : '';
        }
      }catch(_e){}

      // orderbooks - populate top5 tables
      try{
        const fillOrderbook = (id, ob)=>{
          const tbody = document.querySelector(id+' tbody');
          if(!tbody) return;
          tbody.innerHTML='';
          const bids = ob && ob.bids ? ob.bids.slice(0,5) : [];
          const asks = ob && ob.asks ? ob.asks.slice(0,5) : [];
          for(let i=0;i<5;i++){
            const b = bids[i] || {};
            const a = asks[i] || {};
            const tr = document.createElement('tr');
            const td1 = document.createElement('td'); td1.innerText = b.bid_price ? Number(b.bid_price).toLocaleString() : '-';
            const td2 = document.createElement('td'); td2.innerText = b.bid_size || '-';
            const td3 = document.createElement('td'); td3.innerText = a.ask_price ? Number(a.ask_price).toLocaleString() : '-';
            const td4 = document.createElement('td'); td4.innerText = a.ask_size || '-';
            tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
            tbody.appendChild(tr);
          }
        }
        fillOrderbook('#btc_orderbook', j.upbit && j.upbit['KRW-BTC'] ? j.upbit['KRW-BTC'].orderbook : null);
        fillOrderbook('#eth_orderbook', j.upbit && j.upbit['KRW-ETH'] ? j.upbit['KRW-ETH'].orderbook : null);
      }catch(_e){}

    }catch(e){
      // ignore transient errors
    }
  }

  // prefer websocket for metrics/logs; fallback to polling
  (function initRealtime(){
    let ws;
    try{
      ws = new WebSocket((location.protocol==='https:'? 'wss://' : 'ws://') + (new URL(base)).host + '/ws/logs');
      ws.onmessage = (ev)=>{
        try{
          const msg = JSON.parse(ev.data);
          if(msg.metrics){
            // apply metrics update immediately
            document.getElementById('total_assets').innerText = '₩' + Number(msg.metrics.total_assets || 0).toLocaleString();
            document.getElementById('token_cost').innerText = '$' + Number(msg.metrics.token_cost || 0).toFixed(2) + ' (누적)';
            document.getElementById('daily_goal').innerText = (Number(msg.metrics.daily_goal||0)).toFixed(1) + '%';
            document.getElementById('active_agents').innerText = (Number(msg.metrics.active_agents||0)) + ' agents';
          }
          if(msg.source === 'order' && msg.order){
            const node = document.getElementById('log_terminal');
            const line = document.createElement('div');
            line.innerText = `[ORDER] ${msg.order.id} ${msg.order.market} ${msg.order.status} ${msg.order.price || ''}`;
            node.prepend(line);
          }
        }catch(e){/* ignore */}
      };
      ws.onopen = ()=>{ console.info('ws open'); };
      ws.onerror = ()=>{ console.warn('ws error, falling back to polling'); setInterval(pollStream,1000); pollStream(); };
      ws.onclose = ()=>{ console.info('ws closed, fallback to polling'); setInterval(pollStream,1000); pollStream(); };
    }catch(e){
      setInterval(pollStream,1000);
      pollStream();
    }
  })();
})();
</script>
